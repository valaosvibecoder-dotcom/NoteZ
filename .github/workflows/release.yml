name: Build and publish Linux AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build x86-64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NoteZ/package-lock.json

      - name: Install dependencies
        working-directory: NoteZ
        run: npm ci

      - name: Build AppImage
        working-directory: NoteZ
        run: npm run dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./NoteZ/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

          appimage="NoteZ/dist/NoteZ-${version}-x86_64.AppImage"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$appimage" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$appimage" \
              --title "NoteZ $version" \
              --generate-notes
          fi
