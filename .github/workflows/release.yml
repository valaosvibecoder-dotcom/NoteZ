name: Build and publish Linux AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build x86-64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NoteZ/package-lock.json

      - name: Install dependencies
        working-directory: NoteZ
        run: npm ci

      - name: Build AppImage
        working-directory: NoteZ
        run: npm run dist -- --publish never

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./NoteZ/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          appimage="NoteZ/dist/NoteZ-${version}-x86_64.AppImage"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$appimage" --clobber
          else
            gh release create "$RELEASE_TAG" "$appimage" \
              --title "NoteZ $version" \
              --generate-notes
          fi
